name: bookbite
description: A calm, private, offline-first reading companion.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  go_router: 17.3.0
  drift: 2.33.0
  sqlite3: ^3.5.1
  path_provider: 2.1.6
  uuid: 4.6.0
  intl: 0.20.3
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.1
  drift_dev: 2.33.0
  go_router_builder: 4.2.1
  riverpod_generator: 4.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
