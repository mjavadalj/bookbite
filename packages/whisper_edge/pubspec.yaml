name: whisper_edge
description: "On-device speech-to-text for Flutter, powered by whisper.cpp. Offline transcription with timestamps, language detection and model downloads, on iOS and Android."
version: 0.1.1+bookbite.1
homepage: https://popy.app
repository: https://github.com/popyapp/whisper_edge_flutter

topics:
  - speech-to-text
  - transcription
  - whisper
  - offline
  - ffi

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
